name: BrewDeck API Security Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1"
  pull_request:
    branches: [master, develop]
    paths:
      - "brewdeck-api/pom.xml"
      - "brewdeck-api/dependency-check-suppressions.xml"
      - ".github/workflows/security.yml"

# One scan per branch or PR. A new push cancels the running PR scan; scheduled and manual runs
# are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    # Green runs take 25 to 75 minutes (longest: a full NVD sync). A hung NVD download would
    # otherwise hold the job for GitHub's 6-hour default.
    timeout-minutes: 120

    defaults:
      run:
        working-directory: brewdeck-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cache OWASP NVD data
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ runner.os }}-owasp-nvd-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-owasp-nvd-

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run OWASP Dependency Check
        # Repository secret (and a Dependabot secret of the same name, since Dependabot PRs that
        # touch pom.xml run this scan and cannot read Actions secrets).
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw clean verify -Psecurity

      - name: Upload dependency check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: brewdeck-api/target/dependency-check-report.html