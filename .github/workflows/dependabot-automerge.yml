name: Dependabot Auto-Merge

# Scope: only Dependabot PRs against develop. Eligible bumps (patch/minor, and NOT a
# pre-1.0 package's version bump) auto-merge once the checks relevant to their
# ecosystem report success; everything else (major bumps, any 0.x package bump) is
# left for manual review (commented, never merged automatically).
on:
  pull_request:
    branches: [develop]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Generous ceiling: the OWASP scan step this waits on has run anywhere from a few
    # minutes to several hours depending on NVD cache state.
    timeout-minutes: 300
    steps:
      - name: Fetch dependency metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Determine auto-merge eligibility
        id: eligibility
        run: |
          update_type="${{ steps.metadata.outputs.update-type }}"
          previous_version="${{ steps.metadata.outputs.previous-version }}"
          eligible=true
          reason=""
          if [ "$update_type" = "version-update:semver-major" ]; then
            eligible=false
            reason="major version bump"
          elif [[ "$previous_version" == 0.* ]]; then
            # Per semver, a package still on major version 0 may introduce breaking
            # changes on ANY bump, including what Dependabot labels "minor"/"patch"
            # (e.g. jjwt 0.12.6 -> 0.13.0 reports as semver-minor). Treat it like major.
            eligible=false
            reason="pre-1.0 package (currently $previous_version) — a minor/patch bump can still break, per semver"
          fi
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Wait for relevant checks, then merge eligible updates
        if: steps.eligibility.outputs.eligible == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const ecosystem = "${{ steps.metadata.outputs.package-ecosystem }}";
            const requiredByEcosystem = {
              maven: ["API Quality Checks & SonarCloud", "OWASP Dependency Check"],
              npm_and_yarn: ["Web Quality Checks"],
              github_actions: [],
            };
            // "qodana" (the workflow job) has no path filter, so it runs on every PR
            // regardless of ecosystem — always wait for it too.
            const required = ["qodana", ...(requiredByEcosystem[ecosystem] ?? [])];

            const { owner, repo } = context.repo;
            const ref = context.payload.pull_request.head.sha;
            const pull_number = context.payload.pull_request.number;
            const deadline = Date.now() + 1000 * 60 * 280; // stay under the job timeout
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

            core.info(`Waiting for: ${required.join(", ") || "(nothing ecosystem-specific)"}`);

            while (true) {
              // This loop can run for hours (the OWASP scan alone has taken over an
              // hour), so a single transient GitHub API hiccup (5xx/network error)
              // must not kill the whole run - retry a few times before giving up.
              let data;
              for (let attempt = 1; ; attempt++) {
                try {
                  ({ data } = await github.rest.checks.listForRef({ owner, repo, ref, per_page: 100 }));
                  break;
                } catch (err) {
                  const status = err.status ?? 0;
                  if (attempt >= 5 || (status && status < 500)) throw err;
                  core.warning(`checks.listForRef failed (attempt ${attempt}, status ${status}): ${err.message}. Retrying...`);
                  await sleep(10000);
                }
              }
              const byName = new Map(data.check_runs.map((c) => [c.name, c]));

              const failed = required.filter((n) => {
                const c = byName.get(n);
                return c && c.status === "completed" && c.conclusion !== "success";
              });
              if (failed.length > 0) {
                core.setFailed(`Required check(s) failed, not merging: ${failed.join(", ")}`);
                return;
              }

              const pending = required.filter((n) => {
                const c = byName.get(n);
                return !c || c.status !== "completed";
              });
              if (pending.length === 0) break;

              if (Date.now() > deadline) {
                core.setFailed(`Timed out waiting for: ${pending.join(", ")}`);
                return;
              }
              await sleep(30000);
            }

            core.info("All required checks green — merging.");
            await github.rest.pulls.merge({ owner, repo, pull_number, merge_method: "merge" });

      - name: Flag ineligible bump for manual review
        if: steps.eligibility.outputs.eligible == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.html_url }}" \
            --body "Not auto-merged — needs manual review (${{ steps.eligibility.outputs.reason }})."
