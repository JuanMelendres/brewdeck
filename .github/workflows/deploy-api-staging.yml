name: Deploy API to staging

# Staging follows master (ADR-017): every release that touches the API redeploys it. The web app
# deploys itself through Vercel's Git integration. Setup (Workload Identity Federation, deployer
# service account, the "staging" environment and its variables) is in
# docs/development/staging-deployment.md, step 12.
on:
  push:
    branches: [master]
    paths:
      - "brewdeck-api/**"
      - ".github/workflows/deploy-api-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once, and never cancel one halfway through.
concurrency:
  group: deploy-api-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy API (staging)
    # Release PRs already passed api-ci before merging; a manual run is only allowed from master.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.promote.outputs.url }}
    permissions:
      contents: read
      id-token: write # OIDC token for Workload Identity Federation; no JSON key exists.

    env:
      SERVICE: brewdeck-api-staging
      RETENTION_JOB: brewdeck-retention-staging
      REGION: ${{ vars.GCP_REGION }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/brewdeck/brewdeck-api:${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      # GitHub runners are amd64, the platform Cloud Run needs, so a plain build is enough.
      - name: Build and push image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" brewdeck-api
          docker push "$IMAGE"

      # The new revision gets no traffic yet: users stay on the current one until it passes the
      # health check. Flyway still runs when it starts, so migrations must stay backward compatible
      # with the revision that keeps serving. They are forward-only and additive, with one
      # exception: V31 (INTEGER -> NUMERIC temperatures), after which revisions built before it fail
      # Hibernate's schema validation on startup. See staging-deployment.md, "Rollback".
      - name: Deploy candidate revision (no traffic)
        id: candidate
        run: |
          gcloud run deploy "$SERVICE" --image="$IMAGE" --region="$REGION" \
            --no-traffic --tag=candidate --quiet
          url=$(gcloud run services describe "$SERVICE" --region="$REGION" --format=json \
            | jq -r '.status.traffic[] | select(.tag == "candidate") | .url')
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Health check candidate
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.url }}
        run: |
          # Cold start plus Flyway against a sleeping Neon takes a while; readiness reports
          # OUT_OF_SERVICE until the context is up.
          for attempt in $(seq 1 36); do
            body=$(curl -s --max-time 10 "$CANDIDATE_URL/actuator/health" || true)
            echo "attempt $attempt: $body"
            if echo "$body" | grep -q '"status":"UP"'; then exit 0; fi
            sleep 5
          done
          echo "::error::Candidate never reported UP; traffic stays on the current revision."
          exit 1

      - name: Send traffic to the new revision
        id: promote
        run: |
          gcloud run services update-traffic "$SERVICE" --region="$REGION" --to-latest --quiet
          url=$(gcloud run services describe "$SERVICE" --region="$REGION" --format='value(status.url)')
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # The daily retention purge (ADR-021) runs this image as a Cloud Run Job. Point it at the new
      # image only after traffic moved, so the job never runs code older than the service's
      # migrations. Skipped until the job exists (staging-deployment.md, step 13).
      - name: Update retention job image
        run: |
          if gcloud run jobs describe "$RETENTION_JOB" --region="$REGION" >/dev/null 2>&1; then
            gcloud run jobs update "$RETENTION_JOB" --image="$IMAGE" --region="$REGION" --quiet
          else
            echo "::notice::$RETENTION_JOB does not exist yet; see staging-deployment.md, step 13."
          fi

      - name: Summary
        env:
          SERVICE_URL: ${{ steps.promote.outputs.url }}
        run: |
          revision=$(gcloud run services describe "$SERVICE" --region="$REGION" \
            --format='value(status.latestReadyRevisionName)')
          {
            echo "### API deployed to staging"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Revision: \`$revision\`"
            echo "- Image: \`$IMAGE\`"
            echo "- Health: $SERVICE_URL/actuator/health"
            echo "- Retention job: \`$RETENTION_JOB\` (updated when it exists)"
          } >> "$GITHUB_STEP_SUMMARY"
