name: BrewDeck API CI

on:
  push:
    branches: [master, develop]
    paths:
      - "brewdeck-api/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    branches: [master, develop]
    paths:
      - "brewdeck-api/**"
      - ".github/workflows/api-ci.yml"
  workflow_dispatch:

jobs:
  api-quality-checks:
    name: API Quality Checks & SonarCloud
    runs-on: ubuntu-latest
    environment: brewdeck-github-actions

    # Docker Hub's anonymous pull limit is shared by GitHub runner IPs and fails jobs at
    # "Initialize containers". Pull the same official images from the ECR Public mirror.
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_DB: brewdeck
          POSTGRES_USER: brewdeck
          POSTGRES_PASSWORD: brewdeck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brewdeck -d brewdeck"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: brewdeck-api

    env:
      SPRING_PROFILES_ACTIVE: test
      DB_URL: jdbc:postgresql://localhost:5432/brewdeck
      DB_USER: brewdeck
      DB_PASSWORD: brewdeck
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: public.ecr.aws/docker/library/
      # Ryuk lives under testcontainers/ on Docker Hub, not in the library mirror; the runner
      # is thrown away after the job, so nothing is left behind without it.
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cache SonarQube packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Code Quality and Tests
        run: ./mvnw -B clean spotless:check pmd:check verify

      # GitHub does not expose repository secrets to pull_request runs triggered by
      # Dependabot (by design, so a malicious dependency bump can't exfiltrate them),
      # so SONAR_TOKEN is unavailable there. Skip analysis rather than fail the whole
      # job on an auth error unrelated to the actual code/test quality gate above.
      - name: SonarQube Analysis
        if: github.actor != 'dependabot[bot]'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=JuanMelendres_brewdeck -Dsonar.organization=juanmelendres