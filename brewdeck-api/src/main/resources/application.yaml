spring:
  application:
    name: brewdeck-api

  # SMTP connection. Host, port, username, and password bind from SPRING_MAIL_HOST,
  # SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, and SPRING_MAIL_PASSWORD. Only used when
  # brewdeck.mail.enabled=true.
  mail:
    properties:
      mail.smtp.auth: ${SPRING_MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SPRING_MAIL_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  # API messages (errors and Bean Validation) in messages*.properties, chosen by Accept-Language
  # (ADR-015). No fallback to the JVM locale: a server running in Spanish must still answer English
  # to a client that asks for nothing or for an unsupported language.
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        # Instants are bound and read in UTC regardless of the JVM or server zone.
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    placeholders:
      # Zone that pre-V21 zone-less timestamps were written in (V21 converts them to TIMESTAMPTZ).
      legacy_timezone: ${BREWDECK_LEGACY_TIMEZONE:UTC}

  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100

server:
  port: ${SERVER_PORT:8080}
  # The browser reaches the API through the Next.js proxy (ADR-013), which forwards an incoming
  # X-Forwarded-For but does not set one itself. Default "none" (fail-safe): per-IP rate limits
  # (ADR-011) see the proxy's address, i.e. act as one global bucket; per-account limits are
  # unaffected. Set "native" ONLY when a load balancer in front of Next overwrites X-Forwarded-For
  # with the real client IP; Tomcat then trusts it from internal (private/localhost) proxies.
  # With Next exposed directly, "native" would let clients spoof their IP.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

brewdeck:
  ai:
    enabled: ${AI_ENABLED:false}
    # claude (paid API, ADR-006) or ollama (local open-weight model, ADR-016).
    provider: ${AI_PROVIDER:claude}
    model: claude-haiku-4-5
    timeout-seconds: 20
    max-tokens: 1024
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:qwen3:8b}
      timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:90}
      max-tokens: 1024
  auth:
    secret: ${BREWDECK_JWT_SECRET:dev-only-insecure-secret-change-me-at-least-32-bytes}
    token-ttl: ${AUTH_TOKEN_TTL:PT15M}
    refresh-ttl: ${AUTH_REFRESH_TTL:P7D}
    # httpOnly cookie carrying the refresh token (ADR-013). Secure must stay true outside plain-HTTP
    # local development.
    refresh-cookie:
      name: brewdeck_refresh
      path: /api/auth
      secure: ${AUTH_COOKIE_SECURE:true}
      same-site: Strict
    # Existing account promoted to ADMIN at startup. Empty = no admin bootstrap.
    admin-email: ${BREWDECK_ADMIN_EMAIL:}
  rate-limit:
    # In-memory limits on auth endpoints (ADR-011). Keep enabled in every real environment.
    enabled: ${RATE_LIMIT_ENABLED:true}
  mail:
    # true = real SMTP via spring.mail.* (SPRING_MAIL_HOST, SPRING_MAIL_PORT, ...); false = links
    # are only logged. Enabling it without SPRING_MAIL_HOST fails at startup on purpose.
    enabled: ${BREWDECK_MAIL_ENABLED:false}
    from: ${BREWDECK_MAIL_FROM:BrewDeck <no-reply@brewdeck.local>}
    frontend-base-url: ${BREWDECK_MAIL_FRONTEND_BASE_URL:http://localhost:3000}