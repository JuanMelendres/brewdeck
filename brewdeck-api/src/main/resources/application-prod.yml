spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: false

brewdeck:
  auth:
    secret: ${BREWDECK_JWT_SECRET}
# The OpenAPI spec and Swagger UI map every endpoint and schema, which is useful reconnaissance for
# an attacker. Off in production. Set API_DOCS_ENABLED=true only to debug, and turn it off again.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
