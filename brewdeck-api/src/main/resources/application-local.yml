spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/brewdeck}
    username: ${DB_USER:brewdeck}
    password: ${DB_PASSWORD:brewdeck}

  jpa:
    show-sql: true

logging:
  level:
    org.springframework.jdbc.datasource: DEBUG
    org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG

brewdeck:
  # Local dev runs the AI assistant on a free local model: start it with `ollama serve`
  # (docs/development/setup.md). Without Ollama running, the AI buttons answer 503.
  ai:
    enabled: ${AI_ENABLED:true}
    provider: ${AI_PROVIDER:ollama}
  auth:
    refresh-cookie:
      # Local dev runs over plain http://localhost; some browsers drop Secure cookies there.
      secure: ${AUTH_COOKIE_SECURE:false}
