spring:
  # Spring caches one application context per distinct test configuration, and every cached
  # context keeps its own connection pool open against the shared Testcontainers Postgres
  # (max_connections=100). Small pools keep the whole suite well under that limit.
  datasource:
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

app:
  cors:
    allowed-origins: http://localhost:3000

brewdeck:
  ai:
    enabled: false
    model: claude-haiku-4-5
    timeout-seconds: 20
    max-tokens: 1024
  # Integration tests share one client IP and register/log in constantly; the limiter is disabled
  # here and switched on explicitly in RateLimitIntegrationTest.
  rate-limit:
    enabled: false
