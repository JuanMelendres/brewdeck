spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

app:
  cors:
    allowed-origins: http://localhost:3000

brewdeck:
  ai:
    enabled: false
    model: claude-haiku-4-5
    timeout-seconds: 20
    max-tokens: 1024
  # Integration tests share one client IP and register/log in constantly; the limiter is disabled
  # here and switched on explicitly in RateLimitIntegrationTest.
  rate-limit:
    enabled: false
