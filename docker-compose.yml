services:
  postgres:
    image: postgres:16
    container_name: brewdeck-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brewdeck}
      POSTGRES_USER: ${POSTGRES_USER:-brewdeck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brewdeck}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  # Local SMTP catcher: the API sends real emails here instead of to real inboxes.
  # Web UI: http://localhost:8025. Point the API at it with BREWDECK_MAIL_ENABLED=true,
  # SPRING_MAIL_HOST=localhost, and SPRING_MAIL_PORT=1025.
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: brewdeck-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  # Local metrics (OBS-01, ADR-023), off by default: docker compose --profile metrics up -d
  # Prometheus scrapes the API's management port; Grafana at http://localhost:3001 (anonymous).
  # Both bind to localhost only.
  prometheus:
    image: prom/prometheus:v3.7.0
    container_name: brewdeck-prometheus
    profiles: [metrics]
    volumes:
      - ./ops/metrics/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:12.2.0
    container_name: brewdeck-grafana
    profiles: [metrics]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./ops/metrics/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
